name = "$PROJECT_NAME"
main = "./dist/_worker.js/index.js"
compatibility_date = "2025-06-30"
compatibility_flags = ["nodejs_compat"]

[assets]
binding = "ASSETS"
directory = "./dist"
html_handling = "drop-trailing-slash" # See https://developers.cloudflare.com/workers/static-assets/routing/advanced/html-handling/

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "$DATABASE_NAME"
database_id = "$DATABASE_ID"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "SESSION"
id = "eefa5e634e9b46dbaf581de4b0f1be6b"

[[ratelimits]]
name = "COMMENT_LIMIT"
namespace_id = "0001"
simple = { limit = 2, period = 10 }

[[ratelimits]]
name = "EMAIL_LIMIT"
namespace_id = "0002"
simple = { limit = 1, period = 60 }
